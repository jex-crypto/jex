name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Needs network access to a public TSA; flaky on hosted runners.
  SKIP_NETWORK_TESTS: --skip enveloped_xades_t_synthetic_with_cryptopro_tsa

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install PC/SC development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked -- $SKIP_NETWORK_TESTS

      - name: Build without default features
        run: cargo build --locked --no-default-features

  msrv:
    name: Build with minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PC/SC development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev pkg-config

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

  freebsd:
    name: Build and test (FreeBSD)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          envs: CARGO_TERM_COLOR SKIP_NETWORK_TESTS
          prepare: |
            pkg install -y rust pcsc-lite pkgconf
          run: |
            rustc --version
            cargo build --locked
            cargo test --locked -- $SKIP_NETWORK_TESTS
